<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Firewall e segmentazione</title><desc id="desc">Reti separate per studenti, server e Internet con firewall centrale.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#006d77"/></marker><style>.b{fill:#fff;stroke:#d8dee5;stroke-width:2}.n{fill:#e7f0ed;stroke:#006d77;stroke-width:2}.w{fill:#fff3ed;stroke:#c44f24;stroke-width:2}.t{font:700 16px Arial;fill:#17202a}.s{font:14px Arial;fill:#2f4150}.l{stroke:#006d77;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect x="24" y="24" width="712" height="312" rx="8" class="b"/><text x="56" y="66" class="t">Segmentare limita il movimento dei problemi</text>
  <rect x="70" y="105" width="150" height="70" rx="8" class="n"/><text x="145" y="136" text-anchor="middle" class="t">Studenti</text><text x="145" y="158" text-anchor="middle" class="s">solo servizi ammessi</text>
  <rect x="70" y="220" width="150" height="70" rx="8" class="n"/><text x="145" y="251" text-anchor="middle" class="t">Docenti</text><text x="145" y="273" text-anchor="middle" class="s">permessi maggiori</text>
  <rect x="315" y="160" width="130" height="70" rx="8" class="w"/><text x="380" y="190" text-anchor="middle" class="t">Firewall</text><text x="380" y="212" text-anchor="middle" class="s">regole</text>
  <rect x="545" y="105" width="150" height="70" rx="8" class="n"/><text x="620" y="136" text-anchor="middle" class="t">Server</text><text x="620" y="158" text-anchor="middle" class="s">DMZ interna</text>
  <rect x="545" y="220" width="150" height="70" rx="8" class="w"/><text x="620" y="251" text-anchor="middle" class="t">Internet</text><text x="620" y="273" text-anchor="middle" class="s">rete esterna</text>
  <path d="M220 140 L306 180" class="l"/><path d="M220 255 L306 210" class="l"/><path d="M445 180 L536 140" class="l"/><path d="M445 210 L536 255" class="l"/>
  <text x="56" y="326" class="s">Figura 1: firewall, VLAN e ACL separano zone con rischi e permessi diversi.</text>
