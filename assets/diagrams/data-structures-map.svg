<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">Mappa delle strutture dati</title><desc id="desc">Strutture lineari, gerarchiche e associative.</desc><style>.box{fill:#e7f0ed;stroke:#006d77;stroke-width:3}.alt{fill:#fff2ec;stroke:#c44f24;stroke-width:3}.txt{font-family:Arial,sans-serif;fill:#17202a;font-weight:700}.small{font-family:Arial,sans-serif;fill:#34495e;font-size:20px}.line{stroke:#778899;stroke-width:3;fill:none}</style><rect x="340" y="25" width="220" height="64" rx="8" class="box"/><text x="450" y="65" text-anchor="middle" class="txt" font-size="24">Dati in memoria</text><path d="M450 90 V125 M450 125 H175 M450 125 H725" class="line"/><rect x="70" y="150" width="210" height="66" rx="8" class="box"/><text x="175" y="178" text-anchor="middle" class="txt" font-size="22">Lineari</text><text x="175" y="203" text-anchor="middle" class="small">array, liste</text><rect x="345" y="150" width="210" height="66" rx="8" class="box"/><text x="450" y="178" text-anchor="middle" class="txt" font-size="22">Accesso</text><text x="450" y="203" text-anchor="middle" class="small">pile, code</text><rect x="620" y="150" width="210" height="66" rx="8" class="box"/><text x="725" y="178" text-anchor="middle" class="txt" font-size="22">Organizzate</text><text x="725" y="203" text-anchor="middle" class="small">alberi, hash</text><rect x="125" y="265" width="175" height="54" rx="8" class="alt"/><text x="212" y="299" text-anchor="middle" class="txt" font-size="20">indice</text><rect x="365" y="265" width="175" height="54" rx="8" class="alt"/><text x="452" y="299" text-anchor="middle" class="txt" font-size="20">inserisci/estrai</text><rect x="605" y="265" width="175" height="54" rx="8" class="alt"/><text x="692" y="299" text-anchor="middle" class="txt" font-size="20">ricerca</text></svg>