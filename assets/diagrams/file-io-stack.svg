<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">Accesso a file e periferiche</title><desc id="d">Dal programma al file system, al driver e alla periferica.</desc>
<defs><style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#17202a}
  .title{font-size:24px;font-weight:700}
  .label{font-size:16px;font-weight:700}
  .small{font-size:13px;fill:#5f6c78}
  .box{fill:#fff;stroke:#d8dee5;stroke-width:2;rx:10}
  .accent{fill:#e7f0ed;stroke:#006d77;stroke-width:2;rx:10}
  .warn{fill:#fff3ea;stroke:#c44f24;stroke-width:2;rx:10}
  .arrow-line{stroke:#006d77;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .arrow-head{fill:#006d77}
</style></defs>
<text x="40" y="48" class="title">Come un programma raggiunge un file o una periferica</text>
<rect x="250" y="90" width="400" height="65" class="box"/><text x="450" y="130" text-anchor="middle" class="label">Programma applicativo</text>
<rect x="250" y="185" width="400" height="65" class="accent"/><text x="450" y="225" text-anchor="middle" class="label">Chiamate al sistema operativo</text>
<rect x="80" y="310" width="260" height="80" class="box"/><text x="210" y="342" text-anchor="middle" class="label">File system</text><text x="210" y="367" text-anchor="middle" class="small">nomi, cartelle, metadati</text>
<rect x="560" y="310" width="260" height="80" class="box"/><text x="690" y="342" text-anchor="middle" class="label">Driver</text><text x="690" y="367" text-anchor="middle" class="small">comandi specifici del dispositivo</text>
<rect x="80" y="430" width="260" height="55" class="warn"/><text x="210" y="465" text-anchor="middle" class="label">Disco / SSD</text>
<rect x="560" y="430" width="260" height="55" class="warn"/><text x="690" y="465" text-anchor="middle" class="label">Stampante, rete, tastiera...</text>
<line x1="450" y1="155" x2="450" y2="174" class="arrow-line"/><polygon points="450,186 441,170 459,170" class="arrow-head"/>
<polyline points="400,250 400,280 210,280 210,298" class="arrow-line"/><polygon points="210,310 201,294 219,294" class="arrow-head"/>
<polyline points="500,250 500,280 690,280 690,298" class="arrow-line"/><polygon points="690,310 681,294 699,294" class="arrow-head"/>
<line x1="210" y1="390" x2="210" y2="418" class="arrow-line"/><polygon points="210,430 201,414 219,414" class="arrow-head"/>
<line x1="690" y1="390" x2="690" y2="418" class="arrow-line"/><polygon points="690,430 681,414 699,414" class="arrow-head"/>
</svg>
