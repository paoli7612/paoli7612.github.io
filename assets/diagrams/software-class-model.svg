<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Modello delle classi biblioteca</title>
  <desc id="desc">Schema UML semplificato con classi Libro, Prestito e Utente collegate da relazioni.</desc>
  <defs>
    <filter id="softShadow" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102334" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="1060" height="520" rx="10" fill="#ffffff" stroke="#cbd6e2"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(100 120)" filter="url(#softShadow)">
      <rect width="250" height="206" rx="10" fill="#ffffff" stroke="#d3dde8" stroke-width="2"/>
      <path d="M10 0 H240 Q250 0 250 10 V54 H0 V10 Q0 0 10 0" fill="#eaf4f1"/>
      <text x="125" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#0d1724">Libro</text>
      <text x="20" y="82" font-size="14" fill="#41546b">- id</text>
      <text x="20" y="110" font-size="14" fill="#41546b">- titolo</text>
      <text x="20" y="138" font-size="14" fill="#41546b">- autore</text>
      <text x="20" y="166" font-size="14" fill="#41546b">- disponibile</text>
    </g>

    <g transform="translate(425 120)" filter="url(#softShadow)">
      <rect width="250" height="206" rx="10" fill="#ffffff" stroke="#d3dde8" stroke-width="2"/>
      <path d="M10 0 H240 Q250 0 250 10 V54 H0 V10 Q0 0 10 0" fill="#eaf4f1"/>
      <text x="125" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#0d1724">Prestito</text>
      <text x="20" y="82" font-size="14" fill="#41546b">- id</text>
      <text x="20" y="110" font-size="14" fill="#41546b">- dataInizio</text>
      <text x="20" y="138" font-size="14" fill="#41546b">- dataScadenza</text>
      <text x="20" y="166" font-size="14" fill="#41546b">+ chiudi()</text>
    </g>

    <g transform="translate(750 120)" filter="url(#softShadow)">
      <rect width="250" height="206" rx="10" fill="#ffffff" stroke="#d3dde8" stroke-width="2"/>
      <path d="M10 0 H240 Q250 0 250 10 V54 H0 V10 Q0 0 10 0" fill="#eaf4f1"/>
      <text x="125" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#0d1724">Utente</text>
      <text x="20" y="82" font-size="14" fill="#41546b">- id</text>
      <text x="20" y="110" font-size="14" fill="#41546b">- nome</text>
      <text x="20" y="138" font-size="14" fill="#41546b">- classe</text>
      <text x="20" y="166" font-size="14" fill="#41546b">+ puoPrendereLibro()</text>
    </g>

    <line x1="350" y1="223" x2="425" y2="223" stroke="#087b86" stroke-width="4"/>
    <line x1="675" y1="223" x2="750" y2="223" stroke="#087b86" stroke-width="4"/>
    <text x="370" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#c24f27">1</text>
    <text x="405" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#c24f27">0..*</text>
    <text x="695" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#c24f27">0..*</text>
    <text x="730" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#c24f27">1</text>
    <text x="550" y="378" text-anchor="middle" font-size="15" fill="#41546b">Un prestito collega un libro a un utente in un intervallo di tempo.</text>
    <text x="55" y="510" font-size="17" fill="#52647a">Figura 2: Libro, Utente e Prestito sono entità collegate da relazioni significative.</text>
  </g>
</svg>
