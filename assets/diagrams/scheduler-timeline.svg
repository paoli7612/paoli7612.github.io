<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t d">
<title id="t">Timeline dello scheduler</title><desc id="d">Esempio di alternanza tra tre processi sulla CPU con time slice.</desc>
<defs><style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#17202a}
  .title{font-size:24px;font-weight:700}
  .label{font-size:16px;font-weight:700}
  .small{font-size:13px;fill:#5f6c78}
  .axis{stroke:#17202a;stroke-width:2}
  .tick{stroke:#5f6c78;stroke-width:1}
  .p1{fill:#e7f0ed;stroke:#006d77;stroke-width:2}
  .p2{fill:#fff3ea;stroke:#c44f24;stroke-width:2}
  .p3{fill:#f8fafc;stroke:#7b8794;stroke-width:2}
  .queue{fill:#fff;stroke:#d8dee5;stroke-width:2;rx:10}
</style></defs>
<text x="40" y="48" class="title">Lo scheduler alterna i processi sulla CPU</text>
<text x="40" y="86" class="small">Ogni blocco rappresenta un piccolo intervallo di tempo: il time slice.</text>

<line x1="85" y1="320" x2="820" y2="320" class="axis"/>
<text x="82" y="350" class="small" text-anchor="middle">t0</text>
<text x="218" y="350" class="small" text-anchor="middle">t1</text>
<text x="354" y="350" class="small" text-anchor="middle">t2</text>
<text x="490" y="350" class="small" text-anchor="middle">t3</text>
<text x="626" y="350" class="small" text-anchor="middle">t4</text>
<text x="762" y="350" class="small" text-anchor="middle">t5</text>

<line x1="85" y1="300" x2="85" y2="330" class="tick"/>
<line x1="218" y1="300" x2="218" y2="330" class="tick"/>
<line x1="354" y1="300" x2="354" y2="330" class="tick"/>
<line x1="490" y1="300" x2="490" y2="330" class="tick"/>
<line x1="626" y1="300" x2="626" y2="330" class="tick"/>
<line x1="762" y1="300" x2="762" y2="330" class="tick"/>

<rect x="85" y="230" width="133" height="70" rx="8" class="p1"/><text x="151" y="272" text-anchor="middle" class="label">P1</text>
<rect x="218" y="230" width="136" height="70" rx="8" class="p2"/><text x="286" y="272" text-anchor="middle" class="label">P2</text>
<rect x="354" y="230" width="136" height="70" rx="8" class="p3"/><text x="422" y="272" text-anchor="middle" class="label">P3</text>
<rect x="490" y="230" width="136" height="70" rx="8" class="p1"/><text x="558" y="272" text-anchor="middle" class="label">P1</text>
<rect x="626" y="230" width="136" height="70" rx="8" class="p2"/><text x="694" y="272" text-anchor="middle" class="label">P2</text>

<rect x="85" y="120" width="180" height="68" class="queue"/>
<text x="175" y="148" text-anchor="middle" class="label">Coda dei pronti</text>
<text x="175" y="172" text-anchor="middle" class="small">P1, P2, P3</text>
<rect x="360" y="120" width="180" height="68" class="queue"/>
<text x="450" y="148" text-anchor="middle" class="label">Scheduler</text>
<text x="450" y="172" text-anchor="middle" class="small">sceglie chi va in CPU</text>
<rect x="635" y="120" width="180" height="68" class="queue"/>
<text x="725" y="148" text-anchor="middle" class="label">CPU</text>
<text x="725" y="172" text-anchor="middle" class="small">esegue un processo</text>

<line x1="265" y1="154" x2="346" y2="154" stroke="#006d77" stroke-width="4" stroke-linecap="round"/>
<polygon points="360,154 342,144 342,164" fill="#006d77"/>
<line x1="540" y1="154" x2="621" y2="154" stroke="#006d77" stroke-width="4" stroke-linecap="round"/>
<polygon points="635,154 617,144 617,164" fill="#006d77"/>
</svg>
