<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Concorrenza e parallelismo</title>
  <desc id="desc">Confronto tra concorrenza, in cui una CPU alterna rapidamente attivita, e parallelismo, in cui piu CPU o core eseguono attivita simultanee.</desc>
  <defs>
    <filter id="softShadow" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#102334" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowTeal" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 1 2 L 17 9 L 1 16 z" fill="#087b86"/>
    </marker>
  </defs>
  <rect x="16" y="20" width="968" height="394" rx="14" fill="#ffffff" stroke="#cbd6e2"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#102334">
    <text x="72" y="73" font-size="25" font-weight="700">Concorrenza</text>
    <text x="602" y="73" font-size="25" font-weight="700">Parallelismo</text>
    <g filter="url(#softShadow)">
      <rect x="70" y="108" width="350" height="100" rx="12" fill="#eaf4f1" stroke="#087b86" stroke-width="3"/>
      <text x="245" y="150" text-anchor="middle" font-size="20" font-weight="700">Una CPU</text>
      <text x="245" y="181" text-anchor="middle" font-size="16" fill="#41546b">alterna rapidamente le attività</text>
      <rect x="585" y="108" width="350" height="100" rx="12" fill="#eaf4f1" stroke="#087b86" stroke-width="3"/>
      <text x="760" y="150" text-anchor="middle" font-size="20" font-weight="700">Più CPU o core</text>
      <text x="760" y="181" text-anchor="middle" font-size="16" fill="#41546b">eseguono attività nello stesso momento</text>
    </g>
    <g transform="translate(0 4)">
      <line x1="86" y1="254" x2="446" y2="254" stroke="#087b86" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
      <g font-size="16" font-weight="700" text-anchor="middle">
        <rect x="102" y="230" width="65" height="48" rx="8" fill="#f7fbfd" stroke="#087b86" stroke-width="3"/>
        <text x="134.5" y="260">A</text>
        <rect x="183" y="230" width="65" height="48" rx="8" fill="#fff5ef" stroke="#c24f27" stroke-width="3"/>
        <text x="215.5" y="260">B</text>
        <rect x="264" y="230" width="65" height="48" rx="8" fill="#f7fbfd" stroke="#087b86" stroke-width="3"/>
        <text x="296.5" y="260">A</text>
        <rect x="345" y="230" width="49" height="48" rx="8" fill="#fff5ef" stroke="#c24f27" stroke-width="3"/>
        <text x="369.5" y="260">B</text>
      </g>
    </g>
    <g transform="translate(0 4)">
      <line x1="612" y1="247" x2="921" y2="247" stroke="#087b86" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
      <line x1="612" y1="310" x2="921" y2="310" stroke="#087b86" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
      <rect x="643" y="224" width="202" height="46" rx="8" fill="#f7fbfd" stroke="#087b86" stroke-width="3"/>
      <text x="744" y="253" text-anchor="middle" font-size="16" font-weight="700">Attività A</text>
      <rect x="643" y="287" width="202" height="46" rx="8" fill="#fff5ef" stroke="#c24f27" stroke-width="3"/>
      <text x="744" y="316" text-anchor="middle" font-size="16" font-weight="700">Attività B</text>
    </g>
    <text x="245" y="326" text-anchor="middle" font-size="16" fill="#41546b">Le attività avanzano entrambe, ma non nello stesso istante.</text>
    <text x="760" y="376" text-anchor="middle" font-size="16" fill="#41546b">Attività simultanee su risorse hardware separate.</text>
  </g>
</svg>
