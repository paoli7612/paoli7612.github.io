<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">Modelli di comunicazione tra processi</title>
  <desc id="desc">Confronto tra memoria condivisa, pipe o code di messaggi e socket di rete.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#006d77"/>
    </marker>
  </defs>
  <rect x="18" y="18" width="724" height="304" rx="12" fill="#fff" stroke="#d8dee5"/>
  <text x="132" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#17202a">Memoria condivisa</text>
  <text x="380" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#17202a">Messaggi</text>
  <text x="628" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#17202a">Socket</text>

  <rect x="54" y="88" width="96" height="50" rx="9" fill="#e7f0ed" stroke="#006d77" stroke-width="2"/>
  <rect x="114" y="188" width="96" height="50" rx="9" fill="#e7f0ed" stroke="#006d77" stroke-width="2"/>
  <rect x="84" y="138" width="96" height="50" rx="9" fill="#fff1ea" stroke="#c44f24" stroke-width="2"/>
  <text x="102" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#17202a">Processo A</text>
  <text x="162" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#17202a">Processo B</text>
  <text x="132" y="167" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#17202a">Area comune</text>
  <text x="132" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#34495e">Veloce, ma richiede sincronizzazione.</text>

  <rect x="302" y="102" width="86" height="48" rx="9" fill="#e7f0ed" stroke="#006d77" stroke-width="2"/>
  <rect x="372" y="198" width="86" height="48" rx="9" fill="#e7f0ed" stroke="#006d77" stroke-width="2"/>
  <line x1="388" y1="150" x2="372" y2="198" stroke="#006d77" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="326" y="158" width="108" height="34" rx="8" fill="#f7fbff" stroke="#006d77" stroke-width="2"/>
  <text x="345" y="131" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#17202a">A</text>
  <text x="415" y="227" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#17202a">B</text>
  <text x="380" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#34495e">coda / pipe</text>
  <text x="380" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#34495e">I dati viaggiano in un canale gestito.</text>

  <rect x="552" y="98" width="96" height="50" rx="9" fill="#e7f0ed" stroke="#006d77" stroke-width="2"/>
  <rect x="610" y="204" width="96" height="50" rx="9" fill="#e7f0ed" stroke="#006d77" stroke-width="2"/>
  <line x1="648" y1="145" x2="610" y2="207" stroke="#006d77" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#17202a">Client</text>
  <text x="658" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#17202a">Server</text>
  <rect x="560" y="164" width="120" height="26" rx="8" fill="#ffffff" stroke="#d8dee5"/>
  <text x="620" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#34495e">rete + protocollo</text>
  <text x="628" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#34495e">Funziona anche tra macchine diverse.</text>
</svg>
