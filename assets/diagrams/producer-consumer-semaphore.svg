<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Produttore consumatore con buffer</title>
  <desc id="desc">Produttore e consumatore si coordinano tramite buffer, mutex e semafori pieni e vuoti.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#006d77"/>
    </marker>
  </defs>
  <rect x="18" y="18" width="724" height="324" rx="12" fill="#fff" stroke="#d8dee5"/>
  <rect x="58" y="92" width="140" height="74" rx="10" fill="#e7f0ed" stroke="#006d77" stroke-width="2"/>
  <text x="128" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#17202a">Produttore</text>
  <text x="128" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#34495e">genera dati</text>

  <rect x="294" y="76" width="172" height="106" rx="10" fill="#f7fbff" stroke="#006d77" stroke-width="2"/>
  <text x="380" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#17202a">Buffer condiviso</text>
  <rect x="314" y="124" width="30" height="34" rx="4" fill="#fff1ea" stroke="#c44f24"/>
  <rect x="354" y="124" width="30" height="34" rx="4" fill="#fff1ea" stroke="#c44f24"/>
  <rect x="394" y="124" width="30" height="34" rx="4" fill="#ffffff" stroke="#d8dee5"/>
  <rect x="434" y="124" width="12" height="34" rx="3" fill="#ffffff" stroke="#d8dee5"/>

  <rect x="562" y="92" width="140" height="74" rx="10" fill="#e7f0ed" stroke="#006d77" stroke-width="2"/>
  <text x="632" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#17202a">Consumatore</text>
  <text x="632" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#34495e">usa dati</text>

  <line x1="198" y1="129" x2="294" y2="129" stroke="#006d77" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="466" y1="129" x2="562" y2="129" stroke="#006d77" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="246" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#34495e">produce</text>
  <text x="514" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#34495e">preleva</text>

  <rect x="112" y="236" width="152" height="58" rx="10" fill="#fff1ea" stroke="#c44f24" stroke-width="2"/>
  <text x="188" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#17202a">Semaforo vuoti</text>
  <text x="188" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#34495e">posti disponibili</text>

  <rect x="304" y="236" width="152" height="58" rx="10" fill="#fff1ea" stroke="#c44f24" stroke-width="2"/>
  <text x="380" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#17202a">Mutex</text>
  <text x="380" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#34495e">un accesso alla volta</text>

  <rect x="496" y="236" width="152" height="58" rx="10" fill="#fff1ea" stroke="#c44f24" stroke-width="2"/>
  <text x="572" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#17202a">Semaforo pieni</text>
  <text x="572" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#34495e">dati disponibili</text>

  <line x1="188" y1="236" x2="310" y2="174" stroke="#c44f24" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="236" x2="380" y2="182" stroke="#c44f24" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="572" y1="236" x2="450" y2="174" stroke="#c44f24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#34495e">I semafori evitano inserimenti nel buffer pieno e prelievi dal buffer vuoto.</text>
</svg>
