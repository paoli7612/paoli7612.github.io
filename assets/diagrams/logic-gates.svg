<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Porte logiche elementari</title>
  <desc id="desc">Schema con porte AND, OR e NOT e una piccola tabella di verita.</desc>
  <defs><style>.box{fill:#fff;stroke:#d8dee5;stroke-width:2}.gate{fill:#e7f0ed;stroke:#006d77;stroke-width:2}.out{fill:#fff3ed;stroke:#c44f24;stroke-width:2}.t{font:700 17px Arial,Helvetica,sans-serif;fill:#17202a}.s{font:14px Arial,Helvetica,sans-serif;fill:#2f4150}.line{stroke:#006d77;stroke-width:3;fill:none}</style></defs>
  <rect x="24" y="24" width="712" height="312" rx="8" class="box"/>
  <text x="56" y="66" class="t">Le porte logiche combinano valori binari</text>
  <path d="M96 125 H160 M96 165 H160 M250 145 H310" class="line"/><path d="M160 105 H210 Q250 105 250 145 Q250 185 210 185 H160 Z" class="gate"/><text x="204" y="151" text-anchor="middle" class="t">AND</text><rect x="316" y="119" width="76" height="52" rx="8" class="out"/><text x="354" y="151" text-anchor="middle" class="t">1</text><text x="84" y="130" class="s">1</text><text x="84" y="170" class="s">1</text>
  <path d="M96 230 H158 M96 270 H158 M252 250 H310" class="line"/><path d="M158 210 Q224 210 252 250 Q224 290 158 290 Q178 250 158 210 Z" class="gate"/><text x="207" y="256" text-anchor="middle" class="t">OR</text><rect x="316" y="224" width="76" height="52" rx="8" class="out"/><text x="354" y="256" text-anchor="middle" class="t">1</text><text x="84" y="235" class="s">0</text><text x="84" y="275" class="s">1</text>
  <path d="M454 145 H500 M570 145 H622" class="line"/><path d="M500 112 L558 145 L500 178 Z" class="gate"/><circle cx="566" cy="145" r="8" fill="#fff" stroke="#006d77" stroke-width="2"/><text x="529" y="151" text-anchor="middle" class="t">NOT</text><rect x="628" y="119" width="76" height="52" rx="8" class="out"/><text x="666" y="151" text-anchor="middle" class="t">0</text><text x="438" y="151" class="s">1</text>
  <text x="456" y="222" class="t">Idea chiave</text><text x="456" y="249" class="s">AND vale 1 solo se tutti gli ingressi sono 1.</text><text x="456" y="273" class="s">OR vale 1 se almeno un ingresso e 1.</text><text x="456" y="297" class="s">NOT inverte il valore ricevuto.</text>
  <text x="56" y="326" class="s">Figura 1: le operazioni logiche sono la base dei circuiti digitali.</text>
</svg>
