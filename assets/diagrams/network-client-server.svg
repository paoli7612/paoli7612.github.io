<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">Modello client-server</title>
  <desc id="desc">Più client inviano richieste a un server che elabora e restituisce risposte.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#006d77"/>
    </marker>
  </defs>
  <rect x="18" y="18" width="724" height="304" rx="12" fill="#fff" stroke="#d8dee5"/>
  <rect x="72" y="72" width="140" height="58" rx="10" fill="#e7f0ed" stroke="#006d77" stroke-width="2"/>
  <rect x="72" y="142" width="140" height="58" rx="10" fill="#e7f0ed" stroke="#006d77" stroke-width="2"/>
  <rect x="72" y="212" width="140" height="58" rx="10" fill="#e7f0ed" stroke="#006d77" stroke-width="2"/>
  <text x="142" y="107" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#17202a">Client 1</text>
  <text x="142" y="177" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#17202a">Client 2</text>
  <text x="142" y="247" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#17202a">Client 3</text>

  <rect x="510" y="112" width="170" height="118" rx="12" fill="#fff1ea" stroke="#c44f24" stroke-width="2"/>
  <text x="595" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#17202a">Server</text>
  <text x="595" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#34495e">ascolta su una porta</text>
  <text x="595" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#34495e">elabora richieste</text>
  <text x="595" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#34495e">invia risposte</text>

  <line x1="212" y1="101" x2="508" y2="140" stroke="#006d77" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="212" y1="171" x2="508" y2="171" stroke="#006d77" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="212" y1="241" x2="508" y2="202" stroke="#006d77" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="510" y1="154" x2="214" y2="116" stroke="#c44f24" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="185" x2="214" y2="185" stroke="#c44f24" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="216" x2="214" y2="254" stroke="#c44f24" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="145" width="130" height="52" rx="9" fill="#f7fbff" stroke="#d8dee5"/>
  <text x="365" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#34495e">richieste</text>
  <text x="365" y="187" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#34495e">e risposte</text>
  <text x="380" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#34495e">Il server rimane disponibile; i client lo contattano quando hanno bisogno del servizio.</text>
</svg>
