<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Workflow Git con branch e merge</title>
  <desc id="desc">Diagramma che mostra un ramo principale, la creazione di un branch, tre commit sul branch e il merge nel ramo principale.</desc>
  <defs>
    <filter id="softShadow" x="-10%" y="-40%" width="120%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102334" flood-opacity="0.10"/>
    </filter>
    <marker id="mainArrow" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M 1 2 L 15 8 L 1 14 z" fill="#087b86"/>
    </marker>
  </defs>
  <rect x="20" y="8" width="1060" height="544" rx="10" fill="#ffffff" stroke="#cbd6e2"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="100" y="80" font-size="22" font-weight="700" fill="#102334">Workflow Git: branch e merge</text>
    <text x="100" y="112" font-size="17" fill="#506278">Un branch isola una nuova funzionalità; il merge integra le modifiche nel ramo principale.</text>
    <g transform="translate(0 8)">
      <line x1="150" y1="320" x2="920" y2="320" stroke="#087b86" stroke-width="6" stroke-linecap="round" marker-end="url(#mainArrow)"/>
      <path d="M 346 320 C 430 165, 665 150, 835 320" fill="none" stroke="#c24f27" stroke-width="5" stroke-linecap="round"/>
      <g fill="#ffffff" stroke-width="5">
        <circle cx="180" cy="320" r="16" stroke="#087b86"/>
        <circle cx="346" cy="320" r="16" stroke="#087b86"/>
        <circle cx="835" cy="320" r="16" stroke="#087b86"/>
        <circle cx="482" cy="208" r="16" stroke="#c24f27"/>
        <circle cx="622" cy="192" r="16" stroke="#c24f27"/>
        <circle cx="744" cy="240" r="16" stroke="#c24f27"/>
      </g>
      <g font-size="18" font-weight="700" fill="#102334">
        <text x="482" y="180" text-anchor="middle">A</text>
        <text x="622" y="164" text-anchor="middle">B</text>
        <text x="744" y="212" text-anchor="middle">C</text>
      </g>
      <g filter="url(#softShadow)" font-size="14" fill="#41546b">
        <rect x="128" y="360" width="104" height="36" rx="8" fill="#ffffff" stroke="#d5dee8" stroke-width="2"/>
        <text x="180" y="383" text-anchor="middle">commit iniziale</text>
        <rect x="294" y="360" width="104" height="36" rx="8" fill="#ffffff" stroke="#d5dee8" stroke-width="2"/>
        <text x="346" y="383" text-anchor="middle">commit base</text>
        <rect x="779" y="360" width="112" height="36" rx="8" fill="#ffffff" stroke="#d5dee8" stroke-width="2"/>
        <text x="835" y="383" text-anchor="middle">merge</text>
        <rect x="448" y="132" width="218" height="38" rx="9" fill="#fff9f5" stroke="#c24f27" stroke-width="2"/>
        <text x="557" y="156" text-anchor="middle" fill="#794226">branch: nuova funzionalità</text>
      </g>
      <text x="540" y="428" text-anchor="middle" font-size="17" fill="#506278">ramo principale</text>
      <text x="610" y="226" text-anchor="middle" font-size="16" fill="#794226">branch di lavoro</text>
    </g>
    <text x="55" y="516" font-size="17" fill="#52647a">Figura 1: i commit registrano la storia del progetto; i branch separano il lavoro; il merge riporta le modifiche nel ramo principale.</text>
  </g>
</svg>
