<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">Distribuzione di una applicazione</title>
  <desc id="desc">Dal codice al rilascio: repository, build, test, ambiente di staging, produzione e monitoraggio.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#006d77"/></marker></defs>
  <rect x="18" y="18" width="724" height="304" rx="12" fill="#fff" stroke="#d8dee5"/>
  <g font-family="Arial" font-size="12" text-anchor="middle">
    <rect x="50" y="112" width="100" height="64" rx="9" fill="#e7f0ed" stroke="#006d77" stroke-width="2"/><text x="100" y="140" font-weight="700">Codice</text><text x="100" y="160" fill="#34495e">Git</text>
    <rect x="190" y="112" width="100" height="64" rx="9" fill="#f7fbff" stroke="#006d77" stroke-width="2"/><text x="240" y="140" font-weight="700">Build</text><text x="240" y="160" fill="#34495e">pacchetto</text>
    <rect x="330" y="112" width="100" height="64" rx="9" fill="#f7fbff" stroke="#006d77" stroke-width="2"/><text x="380" y="140" font-weight="700">Test</text><text x="380" y="160" fill="#34495e">verifiche</text>
    <rect x="470" y="112" width="100" height="64" rx="9" fill="#fff1ea" stroke="#c44f24" stroke-width="2"/><text x="520" y="140" font-weight="700">Staging</text><text x="520" y="160" fill="#34495e">prova</text>
    <rect x="610" y="112" width="100" height="64" rx="9" fill="#fff1ea" stroke="#c44f24" stroke-width="2"/><text x="660" y="140" font-weight="700">Produzione</text><text x="660" y="160" fill="#34495e">utenti</text>
  </g>
  <line x1="150" y1="144" x2="190" y2="144" stroke="#006d77" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="290" y1="144" x2="330" y2="144" stroke="#006d77" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="430" y1="144" x2="470" y2="144" stroke="#006d77" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="570" y1="144" x2="610" y2="144" stroke="#006d77" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="250" y="230" width="260" height="46" rx="9" fill="#ffffff" stroke="#d8dee5"/>
  <text x="380" y="258" text-anchor="middle" font-family="Arial" font-size="12" fill="#34495e">Monitoraggio: log, errori, prestazioni e disponibilità</text>
  <line x1="660" y1="176" x2="510" y2="236" stroke="#c44f24" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
</svg>
