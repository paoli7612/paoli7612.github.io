<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
<title id="t">Ciclo di deadlock</title>
<desc id="d">Due processi trattengono una risorsa e aspettano la risorsa trattenuta dall'altro processo, creando un blocco reciproco.</desc>
<defs>
  <marker id="waitArrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
    <path d="M0,0 L11,4 L0,8 Z" fill="#006d77"/>
  </marker>
  <marker id="holdArrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
    <path d="M0,0 L11,4 L0,8 Z" fill="#c44f24"/>
  </marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#17202a}
    .title{font-size:24px;font-weight:700}
    .subtitle{font-size:14px;fill:#5f6c78}
    .label{font-size:17px;font-weight:700}
    .small{font-size:13px;fill:#5f6c78}
    .tiny{font-size:12px;fill:#5f6c78}
    .panel{fill:#fbfcfb;stroke:#d8dee5;stroke-width:2}
    .process{fill:#e7f0ed;stroke:#006d77;stroke-width:2}
    .resource{fill:#fff3ea;stroke:#c44f24;stroke-width:2}
    .wait{stroke:#006d77;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none;marker-end:url(#waitArrow)}
    .hold{stroke:#c44f24;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none;marker-end:url(#holdArrow)}
    .badge-wait{fill:#e7f0ed;stroke:#006d77;stroke-width:1.5}
    .badge-hold{fill:#fff3ea;stroke:#c44f24;stroke-width:1.5}
  </style>
</defs>

<rect width="900" height="500" rx="18" fill="#ffffff"/>
<text x="56" y="54" class="title">Deadlock: blocco circolare tra processi e risorse</text>
<text x="56" y="86" class="subtitle">Ogni processo trattiene una risorsa e attende quella che non può ottenere.</text>

<rect x="92" y="132" width="230" height="88" rx="12" class="process"/>
<text x="207" y="166" text-anchor="middle" class="label">Processo A</text>
<text x="207" y="193" text-anchor="middle" class="small">trattiene il file</text>

<rect x="578" y="132" width="230" height="88" rx="12" class="process"/>
<text x="693" y="166" text-anchor="middle" class="label">Processo B</text>
<text x="693" y="193" text-anchor="middle" class="small">trattiene la stampante</text>

<rect x="92" y="318" width="230" height="88" rx="12" class="resource"/>
<text x="207" y="352" text-anchor="middle" class="label">Risorsa 1</text>
<text x="207" y="379" text-anchor="middle" class="small">file</text>

<rect x="578" y="318" width="230" height="88" rx="12" class="resource"/>
<text x="693" y="352" text-anchor="middle" class="label">Risorsa 2</text>
<text x="693" y="379" text-anchor="middle" class="small">stampante</text>

<path d="M207 220 V308" class="hold"/>
<rect x="228" y="252" width="82" height="30" rx="8" class="badge-hold"/>
<text x="269" y="272" text-anchor="middle" class="tiny">trattiene</text>

<path d="M693 220 V308" class="hold"/>
<rect x="590" y="252" width="82" height="30" rx="8" class="badge-hold"/>
<text x="631" y="272" text-anchor="middle" class="tiny">trattiene</text>

<path d="M322 176 C430 138 520 138 578 176" class="wait"/>
<rect x="374" y="112" width="152" height="32" rx="8" class="badge-wait"/>
<text x="450" y="133" text-anchor="middle" class="tiny">A aspetta la stampante</text>

<path d="M578 362 C470 424 336 424 322 362" class="wait"/>
<rect x="382" y="425" width="136" height="32" rx="8" class="badge-wait"/>
<text x="450" y="446" text-anchor="middle" class="tiny">B aspetta il file</text>

<rect x="342" y="233" width="216" height="78" rx="12" class="panel"/>
<text x="450" y="260" text-anchor="middle" class="label">Attesa circolare</text>
<text x="450" y="285" text-anchor="middle" class="small">nessun processo può continuare</text>

<g transform="translate(56 474)">
  <rect x="0" y="-18" width="16" height="16" rx="4" class="badge-hold"/>
  <text x="24" y="-5" class="tiny">freccia arancione: risorsa trattenuta</text>
  <rect x="292" y="-18" width="16" height="16" rx="4" class="badge-wait"/>
  <text x="316" y="-5" class="tiny">freccia verde: risorsa richiesta</text>
</g>
</svg>
