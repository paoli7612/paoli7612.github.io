<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">Ciclo di deadlock</title><desc id="d">Due processi trattengono una risorsa e aspettano l'altra, creando un blocco reciproco.</desc>
<defs><style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#17202a}
  .title{font-size:24px;font-weight:700}
  .label{font-size:17px;font-weight:700}
  .small{font-size:13px;fill:#5f6c78}
  .process{fill:#e7f0ed;stroke:#006d77;stroke-width:2;rx:12}
  .resource{fill:#fff3ea;stroke:#c44f24;stroke-width:2;rx:12}
  .arrow{stroke:#006d77;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .hold{stroke:#c44f24;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .head{fill:#006d77}
  .holdhead{fill:#c44f24}
</style></defs>
<text x="40" y="48" class="title">Deadlock: quando nessuno riesce più ad avanzare</text>
<text x="40" y="86" class="small">Ogni processo possiede una risorsa e aspetta quella posseduta dall'altro.</text>

<rect x="90" y="175" width="190" height="86" class="process"/>
<text x="185" y="211" text-anchor="middle" class="label">Processo A</text>
<text x="185" y="238" text-anchor="middle" class="small">ha il file</text>

<rect x="620" y="175" width="190" height="86" class="process"/>
<text x="715" y="211" text-anchor="middle" class="label">Processo B</text>
<text x="715" y="238" text-anchor="middle" class="small">ha la stampante</text>

<rect x="90" y="345" width="190" height="86" class="resource"/>
<text x="185" y="381" text-anchor="middle" class="label">Risorsa 1</text>
<text x="185" y="408" text-anchor="middle" class="small">file</text>

<rect x="620" y="345" width="190" height="86" class="resource"/>
<text x="715" y="381" text-anchor="middle" class="label">Risorsa 2</text>
<text x="715" y="408" text-anchor="middle" class="small">stampante</text>

<line x1="185" y1="261" x2="185" y2="331" class="hold"/>
<polygon points="185,345 176,329 194,329" class="holdhead"/>
<text x="205" y="309" class="small">trattiene</text>

<line x1="715" y1="261" x2="715" y2="331" class="hold"/>
<polygon points="715,345 706,329 724,329" class="holdhead"/>
<text x="735" y="309" class="small">trattiene</text>

<polyline points="280,218 450,218 620,388" class="arrow"/>
<polygon points="630,398 611,391 624,379" class="head"/>
<text x="365" y="200" class="small">A aspetta la stampante</text>

<polyline points="620,218 450,218 280,388" class="arrow"/>
<polygon points="270,398 276,379 289,391" class="head"/>
<text x="500" y="200" class="small">B aspetta il file</text>

<rect x="315" y="438" width="270" height="42" rx="8" fill="#fff" stroke="#d8dee5" stroke-width="2"/>
<text x="450" y="464" text-anchor="middle" class="small">Il sistema deve prevenire, evitare o risolvere il blocco.</text>
</svg>
