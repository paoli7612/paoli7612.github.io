<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="title desc">
  <title id="title">Architettura software a livelli</title>
  <desc id="desc">Schema con livelli presentazione, logica applicativa, accesso ai dati e persistenza.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#006d77"/>
    </marker>
    <style>
      .layer{stroke:#d8dee5;stroke-width:2}
      .title{font:700 20px Arial, sans-serif;fill:#17202a}
      .text{font:15px Arial, sans-serif;fill:#5f6c78}
      .arrow{stroke:#006d77;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="820" height="470" rx="18" fill="#fbfcfb"/>
  <g transform="translate(90 46)">
    <rect class="layer" x="0" y="0" width="640" height="78" rx="12" fill="#ffffff"/>
    <text class="title" x="320" y="32" text-anchor="middle">Presentazione</text>
    <text class="text" x="320" y="56" text-anchor="middle">pagine, form, pulsanti, messaggi</text>

    <rect class="layer" x="0" y="105" width="640" height="78" rx="12" fill="#e7f0ed"/>
    <text class="title" x="320" y="137" text-anchor="middle">Logica applicativa</text>
    <text class="text" x="320" y="161" text-anchor="middle">regole, controlli, casi d'uso</text>

    <rect class="layer" x="0" y="210" width="640" height="78" rx="12" fill="#ffffff"/>
    <text class="title" x="320" y="242" text-anchor="middle">Accesso ai dati</text>
    <text class="text" x="320" y="266" text-anchor="middle">query, salvataggio, lettura controllata</text>

    <rect class="layer" x="0" y="315" width="640" height="78" rx="12" fill="#f7ebe6"/>
    <text class="title" x="320" y="347" text-anchor="middle">Persistenza</text>
    <text class="text" x="320" y="371" text-anchor="middle">database, file, archivi remoti</text>

    <path class="arrow" d="M320 80 V100"/>
    <path class="arrow" d="M320 185 V205"/>
    <path class="arrow" d="M320 290 V310"/>
  </g>
</svg>
