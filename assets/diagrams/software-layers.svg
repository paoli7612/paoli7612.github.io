<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
  <title id="title">Architettura software a livelli</title>
  <desc id="desc">Schema con livelli presentazione, logica applicativa, accesso ai dati e persistenza.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#006d77"/>
    </marker>
    <style>
      .layer{stroke:#d8dee5;stroke-width:2}
      .num{font:700 15px Arial, sans-serif;fill:#fff}
      .badge{fill:#006d77}
      .title{font:700 20px Arial, sans-serif;fill:#17202a}
      .text{font:15px Arial, sans-serif;fill:#5f6c78}
      .arrow{stroke:#006d77;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="820" height="500" rx="18" fill="#fbfcfb"/>
  <g transform="translate(130 42)">
    <rect class="layer" x="0" y="0" width="560" height="82" rx="12" fill="#ffffff"/>
    <circle class="badge" cx="38" cy="41" r="18"/>
    <text class="num" x="38" y="46" text-anchor="middle">1</text>
    <text class="title" x="280" y="34" text-anchor="middle">Presentazione</text>
    <text class="text" x="280" y="60" text-anchor="middle">pagine, form, pulsanti, messaggi</text>

    <rect class="layer" x="0" y="110" width="560" height="82" rx="12" fill="#e7f0ed"/>
    <circle class="badge" cx="38" cy="151" r="18"/>
    <text class="num" x="38" y="156" text-anchor="middle">2</text>
    <text class="title" x="280" y="144" text-anchor="middle">Logica applicativa</text>
    <text class="text" x="280" y="170" text-anchor="middle">regole, controlli, casi d'uso</text>

    <rect class="layer" x="0" y="220" width="560" height="82" rx="12" fill="#ffffff"/>
    <circle class="badge" cx="38" cy="261" r="18"/>
    <text class="num" x="38" y="266" text-anchor="middle">3</text>
    <text class="title" x="280" y="254" text-anchor="middle">Accesso ai dati</text>
    <text class="text" x="280" y="280" text-anchor="middle">query, salvataggio, lettura controllata</text>

    <rect class="layer" x="0" y="330" width="560" height="82" rx="12" fill="#f7ebe6"/>
    <circle class="badge" cx="38" cy="371" r="18"/>
    <text class="num" x="38" y="376" text-anchor="middle">4</text>
    <text class="title" x="280" y="364" text-anchor="middle">Persistenza</text>
    <text class="text" x="280" y="390" text-anchor="middle">database, file, archivi remoti</text>

    <path class="arrow" d="M280 84 V104"/>
    <path class="arrow" d="M280 194 V214"/>
    <path class="arrow" d="M280 304 V324"/>
  </g>
</svg>
