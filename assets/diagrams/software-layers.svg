<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Applicazione divisa in livelli</title>
  <desc id="desc">Diagramma a quattro livelli: Presentazione, Logica applicativa, Accesso ai dati e Persistenza.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-20%" width="116%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102334" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 16 16" refX="8" refY="8" markerWidth="15" markerHeight="15" orient="auto-start-reverse">
      <path d="M 2 2 L 14 8 L 2 14 z" fill="#087b86"/>
    </marker>
  </defs>
  <rect x="20" y="18" width="1060" height="684" rx="10" fill="#ffffff" stroke="#cbd6e2"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="550" y="70" text-anchor="middle" font-size="30" font-weight="700" fill="#102334">Architettura a livelli</text>
    <text x="550" y="106" text-anchor="middle" font-size="17" fill="#53657a">Ogni livello ha una responsabilità chiara e comunica con quello successivo.</text>
    <g transform="translate(190 128)" filter="url(#shadow)">
      <rect width="720" height="92" rx="12" fill="#ffffff" stroke="#d3dde8" stroke-width="2"/>
      <circle cx="54" cy="46" r="23" fill="#087b86"/>
      <text x="54" y="54" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">1</text>
      <text x="360" y="39" text-anchor="middle" font-size="25" font-weight="700" fill="#0d1724">Presentazione</text>
      <text x="360" y="69" text-anchor="middle" font-size="18" fill="#52647a">pagine, form, pulsanti, messaggi</text>
    </g>
    <line x1="550" y1="234" x2="550" y2="262" stroke="#087b86" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(190 274)" filter="url(#shadow)">
      <rect width="720" height="92" rx="12" fill="#eaf4f1" stroke="#d3dde8" stroke-width="2"/>
      <circle cx="54" cy="46" r="23" fill="#087b86"/>
      <text x="54" y="54" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">2</text>
      <text x="360" y="39" text-anchor="middle" font-size="25" font-weight="700" fill="#0d1724">Logica applicativa</text>
      <text x="360" y="69" text-anchor="middle" font-size="18" fill="#52647a">regole, controlli, casi d'uso</text>
    </g>
    <line x1="550" y1="380" x2="550" y2="408" stroke="#087b86" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(190 420)" filter="url(#shadow)">
      <rect width="720" height="92" rx="12" fill="#ffffff" stroke="#d3dde8" stroke-width="2"/>
      <circle cx="54" cy="46" r="23" fill="#087b86"/>
      <text x="54" y="54" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">3</text>
      <text x="360" y="39" text-anchor="middle" font-size="25" font-weight="700" fill="#0d1724">Accesso ai dati</text>
      <text x="360" y="69" text-anchor="middle" font-size="18" fill="#52647a">query, salvataggio, lettura controllata</text>
    </g>
    <line x1="550" y1="526" x2="550" y2="554" stroke="#087b86" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(190 566)" filter="url(#shadow)">
      <rect width="720" height="92" rx="12" fill="#f6e9e3" stroke="#d3dde8" stroke-width="2"/>
      <circle cx="54" cy="46" r="23" fill="#087b86"/>
      <text x="54" y="54" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">4</text>
      <text x="360" y="39" text-anchor="middle" font-size="25" font-weight="700" fill="#0d1724">Persistenza</text>
      <text x="360" y="69" text-anchor="middle" font-size="18" fill="#52647a">database, file, archivi remoti</text>
    </g>
    <text x="55" y="682" font-size="17" fill="#52647a">Figura 1: dividere l'applicazione in livelli aiuta a isolare presentazione, regole e dati.</text>
  </g>
</svg>
