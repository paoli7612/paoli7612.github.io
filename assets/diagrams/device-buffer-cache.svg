<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
<title id="t">Buffer, cache e periferica</title><desc id="d">Schema del passaggio dati tra applicazione, sistema operativo, buffer, driver e periferica.</desc>
<defs><style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#17202a}
  .title{font-size:24px;font-weight:700}
  .label{font-size:16px;font-weight:700}
  .small{font-size:13px;fill:#5f6c78}
  .box{fill:#fff;stroke:#d8dee5;stroke-width:2;rx:10}
  .accent{fill:#e7f0ed;stroke:#006d77;stroke-width:2;rx:10}
  .warn{fill:#fff3ea;stroke:#c44f24;stroke-width:2;rx:10}
  .arrow{stroke:#006d77;stroke-width:4;stroke-linecap:round;fill:none}
  .head{fill:#006d77}
</style></defs>
<text x="40" y="48" class="title">Perché servono buffer e cache</text>
<text x="40" y="82" class="small">La CPU è molto veloce, molte periferiche sono più lente: il sistema operativo fa da regolatore.</text>

<rect x="55" y="185" width="150" height="80" class="box"/>
<text x="130" y="218" text-anchor="middle" class="label">Programma</text>
<text x="130" y="244" text-anchor="middle" class="small">richiede I/O</text>

<rect x="265" y="185" width="150" height="80" class="accent"/>
<text x="340" y="218" text-anchor="middle" class="label">Sistema</text>
<text x="340" y="244" text-anchor="middle" class="small">controlla e coordina</text>

<rect x="475" y="130" width="150" height="80" class="warn"/>
<text x="550" y="163" text-anchor="middle" class="label">Cache</text>
<text x="550" y="189" text-anchor="middle" class="small">copie veloci</text>

<rect x="475" y="245" width="150" height="80" class="warn"/>
<text x="550" y="278" text-anchor="middle" class="label">Buffer</text>
<text x="550" y="304" text-anchor="middle" class="small">dati in attesa</text>

<rect x="685" y="185" width="160" height="80" class="box"/>
<text x="765" y="218" text-anchor="middle" class="label">Driver</text>
<text x="765" y="244" text-anchor="middle" class="small">comandi specifici</text>

<rect x="685" y="350" width="160" height="80" class="accent"/>
<text x="765" y="383" text-anchor="middle" class="label">Periferica</text>
<text x="765" y="409" text-anchor="middle" class="small">disco, stampante, rete</text>

<line x1="205" y1="225" x2="251" y2="225" class="arrow"/><polygon points="265,225 247,215 247,235" class="head"/>
<line x1="415" y1="205" x2="462" y2="180" class="arrow"/><polygon points="475,173 455,173 464,190" class="head"/>
<line x1="415" y1="245" x2="462" y2="270" class="arrow"/><polygon points="475,277 464,260 455,277" class="head"/>
<line x1="625" y1="285" x2="672" y2="245" class="arrow"/><polygon points="685,235 665,240 678,255" class="head"/>
<line x1="765" y1="265" x2="765" y2="336" class="arrow"/><polygon points="765,350 756,334 774,334" class="head"/>
<line x1="685" y1="390" x2="640" y2="390" class="arrow"/><polygon points="626,390 644,380 644,400" class="head"/>
<text x="545" y="395" class="small">interrupt: lavoro completato o errore</text>
</svg>
