<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">Strati di un sistema operativo</title><desc id="d">Utente, applicazioni, sistema operativo e hardware disposti a livelli.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#006d77"/></marker><style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#17202a}
  .title{font-size:24px;font-weight:700}
  .label{font-size:16px;font-weight:700}
  .small{font-size:13px;fill:#5f6c78}
  .box{fill:#fff;stroke:#d8dee5;stroke-width:2;rx:10}
  .accent{fill:#e7f0ed;stroke:#006d77;stroke-width:2;rx:10}
  .warn{fill:#fff3ea;stroke:#c44f24;stroke-width:2;rx:10}
  .line{stroke:#006d77;stroke-width:3;fill:none;marker-end:url(#arrow)}
</style></defs>
<text x="40" y="48" class="title">Il sistema operativo come intermediario</text>
<rect x="210" y="80" width="480" height="70" class="box"/><text x="450" y="122" text-anchor="middle" class="label">Utente</text>
<rect x="210" y="180" width="480" height="70" class="box"/><text x="450" y="222" text-anchor="middle" class="label">Applicazioni</text>
<rect x="210" y="280" width="480" height="80" class="accent"/><text x="450" y="315" text-anchor="middle" class="label">Sistema operativo</text><text x="450" y="340" text-anchor="middle" class="small">gestisce richieste, protezione e risorse</text>
<rect x="210" y="395" width="480" height="70" class="warn"/><text x="450" y="437" text-anchor="middle" class="label">Hardware: CPU, memoria, disco, rete, periferiche</text>
<path d="M450 150 V175" class="line"/><path d="M450 250 V275" class="line"/><path d="M450 360 V390" class="line"/>
</svg>