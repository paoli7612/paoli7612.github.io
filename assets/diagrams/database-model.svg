<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">Dal modello concettuale al database relazionale</title><desc id="desc">Entità e relazioni diventano tabelle collegate da chiavi.</desc><style>.entity{fill:#e7f0ed;stroke:#006d77;stroke-width:3}.table{fill:#fff;stroke:#778899;stroke-width:2}.rel{fill:#fff2ec;stroke:#c44f24;stroke-width:3}.txt{font-family:Arial,sans-serif;fill:#17202a;font-weight:700}.small{font-family:Arial,sans-serif;fill:#34495e;font-size:18px}.line{stroke:#006d77;stroke-width:4;fill:none}</style><rect x="60" y="60" width="180" height="70" rx="8" class="entity"/><text x="150" y="103" text-anchor="middle" class="txt" font-size="22">Utente</text><rect x="660" y="60" width="180" height="70" rx="8" class="entity"/><text x="750" y="103" text-anchor="middle" class="txt" font-size="22">Libro</text><polygon points="395,70 505,95 395,120 285,95" class="rel"/><text x="395" y="101" text-anchor="middle" class="txt" font-size="20">Prestito</text><path d="M240 95 H285 M505 95 H660 M395 120 V178" class="line"/><rect x="80" y="220" width="190" height="90" rx="6" class="table"/><text x="175" y="245" text-anchor="middle" class="txt" font-size="20">Utenti</text><text x="175" y="273" text-anchor="middle" class="small">id_utente PK</text><text x="175" y="297" text-anchor="middle" class="small">nome, email</text><rect x="355" y="205" width="190" height="120" rx="6" class="table"/><text x="450" y="230" text-anchor="middle" class="txt" font-size="20">Prestiti</text><text x="450" y="258" text-anchor="middle" class="small">id_prestito PK</text><text x="450" y="282" text-anchor="middle" class="small">id_utente FK</text><text x="450" y="306" text-anchor="middle" class="small">id_libro FK</text><rect x="630" y="220" width="190" height="90" rx="6" class="table"/><text x="725" y="245" text-anchor="middle" class="txt" font-size="20">Libri</text><text x="725" y="273" text-anchor="middle" class="small">id_libro PK</text><text x="725" y="297" text-anchor="middle" class="small">titolo, autore</text></svg>