<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">API REST e servizio web</title>
  <desc id="desc">Client e servizio web comunicano con endpoint, metodi HTTP, dati JSON e codici di stato.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#006d77"/></marker></defs>
  <rect x="18" y="18" width="724" height="324" rx="12" fill="#fff" stroke="#d8dee5"/>
  <rect x="60" y="118" width="130" height="70" rx="10" fill="#e7f0ed" stroke="#006d77" stroke-width="2"/>
  <text x="125" y="148" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700">Client</text>
  <text x="125" y="171" text-anchor="middle" font-family="Arial" font-size="12" fill="#34495e">app o browser</text>
  <rect x="306" y="78" width="154" height="150" rx="12" fill="#fff1ea" stroke="#c44f24" stroke-width="2"/>
  <text x="383" y="112" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700">API REST</text>
  <text x="383" y="139" text-anchor="middle" font-family="Arial" font-size="12" fill="#34495e">GET /libri</text>
  <text x="383" y="162" text-anchor="middle" font-family="Arial" font-size="12" fill="#34495e">POST /prestiti</text>
  <text x="383" y="185" text-anchor="middle" font-family="Arial" font-size="12" fill="#34495e">JSON + codici</text>
  <rect x="570" y="118" width="130" height="70" rx="10" fill="#f7fbff" stroke="#006d77" stroke-width="2"/>
  <text x="635" y="148" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700">Servizio</text>
  <text x="635" y="171" text-anchor="middle" font-family="Arial" font-size="12" fill="#34495e">logica e dati</text>
  <line x1="190" y1="138" x2="306" y2="138" stroke="#006d77" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="306" y1="172" x2="190" y2="172" stroke="#c44f24" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="460" y1="153" x2="570" y2="153" stroke="#006d77" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="248" y="120" text-anchor="middle" font-family="Arial" font-size="12" fill="#34495e">richiesta HTTP</text>
  <text x="248" y="198" text-anchor="middle" font-family="Arial" font-size="12" fill="#34495e">risposta JSON</text>
  <text x="380" y="292" text-anchor="middle" font-family="Arial" font-size="12" fill="#34495e">L'API è il contratto pubblico: dice quali operazioni sono disponibili e come usarle.</text>
</svg>
